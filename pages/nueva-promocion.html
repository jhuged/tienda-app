<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Nueva promoción - Figuroom</title><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css"><link rel="stylesheet" href="../css/forms.css"></head><body><div id="topbar" data-title="Nueva promoción" data-subtitle="Crear combo de productos"></div><main class="form-layout"><form class="form-card" data-form="promotion" data-success-url="coleccion-dashboard.html"><h2>Nueva promoción</h2><p>Describe los productos incluidos en el combo.</p><div class="form-grid"><div class="field"><label>Colección</label><select name="collectionId"><option value="COL-001">Mundial 2026</option><option value="COL-002">Thundercats</option><option value="COL-003">Dragon Ball</option></select></div><div class="field full"><label>Nombre de promoción</label><input name="name" required placeholder="Álbum + 5 sobres"></div><div class="field full"><label>Productos incluidos</label><textarea name="products" required placeholder="Álbum tapadura x1, sobre individual x5"></textarea></div><div class="field"><label>Precio de venta</label><input name="price" type="number" min="0" step="0.01" required></div><div class="field"><label>Stock de combos</label><input name="stock" type="number" min="0" required></div></div><div class="form-actions"><a class="secondary-button" href="coleccion-dashboard.html">Cancelar</a><button class="primary-button" type="submit">Crear promoción</button></div></form></main><div id="bottom-nav"></div><script src="../js/components.js"></script></body></html>
