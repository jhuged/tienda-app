<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Carrito - Figuroom</title>

    <link
        rel="stylesheet"
        href="../css/components.css"
    >

    <link
        rel="stylesheet"
        href="https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css"
    >

    <link
        rel="stylesheet"
        href="../css/forms.css"
    >
</head>

<body>

    <div
        id="topbar"
        data-title="Carrito"
        data-subtitle="Pedido actual"
        data-back-href="../index.html"
    ></div>


    <main class="form-layout">

        <section class="form-card">

            <h2>
                Carrito de pedido
            </h2>

            <p>
                Agrega productos, selecciona el cliente y confirma el pedido.
            </p>


            <!-- CLIENTE -->

            <div class="field">

                <label for="cart-client">
                    Cliente
                </label>

                <select id="cart-client">

                    <option value="">
                        Selecciona un cliente
                    </option>

                </select>

            </div>


            <!-- AGREGAR PRODUCTOS -->

            <div class="field">

                <label for="cart-product-search">
                    Agregar productos
                </label>

                <input
                    type="search"
                    id="cart-product-search"
                    placeholder="Buscar producto..."
                    autocomplete="off"
                >

                <div
                    id="cart-product-results"
                    class="search-results"
                    hidden
                ></div>

            </div>


            <!-- PRODUCTOS -->

            <div
                class="sale-lines"
                id="cart-lines"
            >

                <div class="card-label">
                    Productos añadidos
                </div>

            </div>


            <!-- TOTAL -->

            <div class="sale-total">

                <span>
                    Total
                </span>

                <strong id="cart-total">
                    S/ 0.00
                </strong>

            </div>


            <!-- ACCIONES -->

            <div class="form-actions">

                <a
                    class="secondary-button"
                    href="../index.html"
                >
                    Cancelar
                </a>

                <button
                    class="primary-button"
                    id="confirm-cart"
                    type="button"
                >
                    Confirmar pedido
                </button>

            </div>

        </section>

    </main>


    <div id="bottom-nav"></div>


    <script src="../js/components.js"></script>
    <script src="../js/app.js"></script>

</body>

</html>
