<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Nueva preventa - Figuroom</title><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css"><link rel="stylesheet" href="../css/forms.css"></head><body><div id="topbar" data-title="Nueva preventa" data-subtitle="Pedido reservado" data-back-href="coleccion-dashboard.html"></div><main class="form-layout"><form class="form-card" data-form="preorder" data-success-url="preventa.html"><h2>Añadir preventa</h2><p>Registra el pedido de un cliente para esta colección.</p><div class="form-grid"><div class="field full"><label>Cliente</label><select name="clientId" required><option value="">Selecciona un cliente</option></select></div><div class="field full"><label>Pedido</label><textarea name="products" required placeholder="Producto y cantidad solicitada"></textarea></div><div class="field"><label>Cantidad</label><input name="quantity" type="number" min="1" required></div><div class="field"><label>Fecha de entrega</label><input name="deliveryDate" type="date"></div><div class="field full"><label>Imagen opcional (URL)</label><input name="image" type="url" placeholder="https://..."></div></div><input type="hidden" name="collectionId"><div class="form-actions"><a class="secondary-button" href="preventa.html">Cancelar</a><button class="primary-button" type="submit">Guardar preventa</button></div></form></main><div id="bottom-nav"></div><script src="../js/components.js"></script></body></html>
