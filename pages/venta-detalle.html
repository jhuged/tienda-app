<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Figuroom - Detalle de venta</title>

<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/venta-detalle.css">


</head>

<body>


<div
    data-component="topbar"
    data-title="Detalle de venta"
    data-subtitle="Información de la compra"
    data-back-href="ventas.html"
></div>

<main class="main-content">

    <!-- CABECERA DE LA VENTA -->
    <section class="sale-header">

        <div>
            <span>Cliente</span>
            <strong data-sale-client>—</strong>
        </div>

        <div class="sale-date">
            <span>Fecha</span>
            <strong data-sale-date>—</strong>
        </div>

    </section>


    <!-- PRODUCTOS -->
    <section class="detail-section">

        <div class="section-heading">
            <h2>Productos</h2>
            <span data-sale-product-count>0 productos</span>
        </div>

        <div data-sale-products></div>

    </section>


    <!-- PAGOS -->
    <section class="payment-section">

        <div class="payment-row">
            <span>Total</span>
            <strong data-sale-total>S/ 0.00</strong>
        </div>

        <div class="payment-row">
            <span>Pago:</span>
            <strong class="paid" data-sale-paid>S/ 0.00</strong>
        </div>

        <div class="payment-row">
            <span>Deuda:</span>
            <strong class="due" data-sale-debt>S/ 0.00</strong>
        </div>

    </section>


    <!-- ESTADO -->
    <div
        class="status-badge"
        data-sale-status
    >
        Pago pendiente
    </div>


    <!-- AÑADIR PAGO -->
    <button
        type="button"
        class="primary-button payment-button"
        data-add-payment
    >
        <i class="fi fi-rr-plus"></i>
        Añadir pago
    </button>

</main>


<div data-component="bottom-nav"></div>
<script src="../js/components.js"></script>
<script src="../js/app.js"></script>

</body>
</html>
