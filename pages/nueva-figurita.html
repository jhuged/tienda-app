<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Figuroom - Nueva figurita</title>

    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/forms.css">
</head>

<body>

    <div
        data-component="topbar"
        data-title="Figuroom"
        data-subtitle="Nueva figurita"
        data-back-href="inventario-figuritas.html"
    ></div>

    <main class="form-layout">

        <form
            class="form-card"
            data-form="product"
            data-category="figuritas"
        >

            <h2>Datos de la figurita</h2>

            <p>
                Registra una nueva figurita para tu colección.
            </p>

            <div class="form-grid">

                <div class="field full">
                    <label for="figure-collection">
                        Colección
                    </label>

                    <select
                        id="figure-collection"
                        name="collectionId"
                        required
                    >
                        <option value="">
                            Selecciona una colección
                        </option>
                    </select>
                </div>

                <div class="field">
                    <label for="figure-name">
                        Nombre
                    </label>

                    <input
                        id="figure-name"
                        name="name"
                        type="text"
                        placeholder="Ej. Goku"
                        required
                    >
                </div>

                <div class="field">
                    <label for="figure-number">
                        Número
                    </label>

                    <input
                        id="figure-number"
                        name="number"
                        type="text"
                        placeholder="Ej. 12"
                    >
                </div>

                <div class="field">
                    <label for="figure-type">
                        Tipo
                    </label>

                    <select
                        id="figure-type"
                        name="type"
                    >
                        <option value="">
                            Selecciona un tipo
                        </option>

                        <option value="Normal">
                            Normal
                        </option>

                        <option value="Especial">
                            Especial
                        </option>

                        <option value="Escudo">
                            Escudo
                        </option>

                        <option value="Jugador">
                            Jugador
                        </option>
                    </select>
                </div>

                <div class="field">
                    <label for="figure-price">
                        Precio
                    </label>

                    <input
                        id="figure-price"
                        name="price"
                        type="number"
                        min="0"
                        step="0.01"
                        placeholder="0.00"
                        required
                    >
                </div>

                <div class="field">
                    <label for="figure-stock">
                        Stock
                    </label>

                    <input
                        id="figure-stock"
                        name="stock"
                        type="number"
                        min="0"
                        step="1"
                        placeholder="0"
                        required
                    >
                </div>

                <div class="field full">
                    <label for="figure-image">
                        Imagen
                    </label>

                    <input
                        id="figure-image"
                        name="image"
                        type="file"
                        accept="image/*"
                    >

                    <small>
                        Selecciona una imagen desde tu dispositivo.
                    </small>
                </div>

            </div>

            <div class="form-actions">

                <a
                    class="secondary-button"
                    href="inventario-figuritas.html"
                >
                    Cancelar
                </a>

                <button
                    class="primary-button"
                    type="submit"
                >
                    Guardar figurita
                </button>

            </div>

        </form>

    </main>

    <div data-component="bottom-nav"></div>

    <script src="../js/components.js"></script>
    <script src="../js/app.js"></script>

</body>
</html>
