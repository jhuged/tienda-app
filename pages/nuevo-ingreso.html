<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Nuevo ingreso - Figuroom</title><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css"><link rel="stylesheet" href="../css/forms.css"></head><body><div id="topbar" data-title="Nuevo ingreso" data-subtitle="Registra un movimiento" data-back-href="../index.html"></div><main class="form-layout"><form class="form-card" data-form="income" data-success-url="../index.html"><h2>Nuevo ingreso</h2><p>Registra un ingreso o gasto para mantener actualizado el resumen.</p><div class="form-grid"><div class="field"><label for="income-type">Tipo</label><select id="income-type" name="type"><option>Ingreso</option><option>Gasto</option></select></div><div class="field"><label for="income-amount">Monto</label><input id="income-amount" name="amount" type="number" min="0" step="0.01" required></div><div class="field full"><label for="income-description">Descripción</label><textarea id="income-description" name="description" required></textarea></div></div><div class="form-actions"><a class="secondary-button" href="../index.html">Cancelar</a><button class="primary-button" type="submit">Guardar movimiento</button></div></form></main><div id="bottom-nav"></div><script src="../js/components.js"></script></body></html>
