<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Agregar paquetón - Figuroom</title><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css"><link rel="stylesheet" href="../css/forms.css"></head><body><div id="topbar" data-title="Agregar paquetón" data-subtitle="Inventario de paquetones"></div><main class="form-layout"><form class="form-card" data-form="bundle" data-success-url="coleccion-dashboard.html"><input type="hidden" name="category" value="paquetones"><h2>Agregar presentación de paquetones</h2><p>Registra 1, 2, 3 u otra cantidad de paquetones.</p><div class="form-grid"><div class="field full"><label>Colección</label><select name="collectionId"><option value="COL-001">Mundial 2026</option><option value="COL-002">Thundercats</option><option value="COL-003">Dragon Ball</option></select></div><div class="field"><label>Cantidad de paquetones</label><input name="quantity" type="number" min="1" required></div><div class="field"><label>Precio de venta</label><input name="price" type="number" min="0" step="0.01" required></div><div class="field"><label>Stock</label><input name="stock" type="number" min="0" required></div></div><div class="form-actions"><a class="secondary-button" href="colecciones.html">Cancelar</a><button class="primary-button" type="submit">Guardar paquetón</button></div></form></main><div id="bottom-nav"></div><script src="../js/components.js"></script></body></html>
