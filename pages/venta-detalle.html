<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detalle de venta - Figuroom</title>

    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
    <link rel="stylesheet" href="../css/venta-detalle.css">
</head>

<body>

    <!-- BARRA SUPERIOR -->

    <div id="topbar" data-title="Detalle de venta" data-subtitle="Información de la compra" data-back-href="ventas.html"></div>


    <!-- CONTENIDO -->

    <main class="main-content">

        <!-- CLIENTE Y FECHA -->

        <section class="sale-header">

            <div>
                <span>Cliente</span>

                <strong>
                    Juan Pérez
                </strong>
            </div>

            <div class="sale-date">
                <span>Fecha</span>

                <strong>
                    16/09/2026
                </strong>
            </div>

        </section>


        <!-- PRODUCTOS -->

        <section class="detail-section">

            <div class="section-heading">

                <h2>Productos</h2>

                <span>3 productos</span>

            </div>


            <div class="product-row">

                <div>
                    <strong>
                        Álbum Mundial 2026
                    </strong>

                    <small>
                        1 × S/ 20.00
                    </small>
                </div>

                <strong>
                    S/ 20.00
                </strong>

            </div>


            <div class="product-row">

                <div>
                    <strong>
                        Figuritas Panini
                    </strong>

                    <small>
                        10 × S/ 1.00
                    </small>
                </div>

                <strong>
                    S/ 10.00
                </strong>

            </div>


            <div class="product-row">

                <div>
                    <strong>
                        Escudo
                    </strong>

                    <small>
                        1 × S/ 10.00
                    </small>
                </div>

                <strong>
                    S/ 10.00
                </strong>

            </div>

        </section>


        <!-- RESUMEN DEL PAGO -->

        <section class="payment-section">

            <div class="payment-row">

                <span>Total</span>

                <strong>
                    S/ 40.00
                </strong>

            </div>


            <div class="payment-row">

                <span>Pagó</span>

                <strong class="paid">
                    S/ 30.00
                </strong>

            </div>


            <div class="payment-row">

                <span>Debe</span>

                <strong class="due">
                    S/ 10.00
                </strong>

            </div>

        </section>


        <!-- ESTADO -->

        <div class="status-badge">
            Pago pendiente
        </div>


        <!-- BOTONES -->

        <button class="primary-button payment-button">
            <i class="fi fi-rr-check-circle"></i> Pago
        </button>

    </main>


    <!-- BARRA INFERIOR -->

    <div id="bottom-nav"></div>

    <script src="../js/components.js"></script>

</body>

</html>
